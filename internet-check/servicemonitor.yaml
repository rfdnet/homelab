apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: speedtest-exporter-monitor
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: speedtest-exporter-http
  namespaceSelector:
    matchNames:
      - internet-check-home
  endpoints:
    - targetPort: 80
      path: /speedtest.prom
      interval: 60s
      scrapeTimeout: 30s
